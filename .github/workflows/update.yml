name: Update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2
          sudo chmod a+rw /dev/fuse
      - name: Bump formulas and manifests to latest releases
        run: scripts/update.sh
      - name: Commit
        run: |
          extra=
          [ -d bucket ] && extra=bucket
          git diff --quiet -- Formula $extra && exit 0
          scripts/test-rewrite.sh
          git add Formula
          [ -d bucket ] && git add bucket
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --name-only | grep -qx Formula/mortar.rb &&
            [ "$(git diff --cached --name-only | wc -l)" -eq 1 ]; then
            git commit -m "mortar: $(grep -m1 -o 'download/v[^/]*' Formula/mortar.rb | cut -d/ -f2)"
          else
            git commit -m "packaging: latest releases"
          fi
          git push
