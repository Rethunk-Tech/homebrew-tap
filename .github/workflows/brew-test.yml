name: brew test

# Installs and tests the formulas through real Homebrew with FUSE, only when a
# formula changes: setting up Homebrew costs minutes the default CI should not.
on:
  push:
    branches: [main]
    paths: ["Formula/**", ".github/workflows/brew-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mortar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # main
      # The AppImage's GUI libraries load even for --version; a desktop has them, the runner does not.
      - name: FUSE and Mortar's desktop libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fuse libfuse2t64 libegl1 libgtk-3-0t64 libwebkit2gtk-4.1-0
          sudo modprobe fuse || true
      - name: Install and test mortar
        run: |
          # setup-homebrew taps this checkout as rethunk-tech/tap; brew refuses a bare formula path.
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --formula rethunk-tech/tap/mortar
          brew test rethunk-tech/tap/mortar
